server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Client-side assets (JS, CSS) — outside the document root
    location /client {
        alias /var/www/html/client;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            expires max;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # Portal API (must be before /api/v1/ to take precedence)
    location ~ ^/api/v1/portal-access/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/v1/portal-access/index.php;
        fastcgi_param SCRIPT_NAME     /api/v1/portal-access/index.php;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_read_timeout 300;
    }

    # REST API — all requests routed to api/v1/index.php
    location ~ ^/api/v1/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/v1/index.php;
        fastcgi_param SCRIPT_NAME     /api/v1/index.php;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_read_timeout 300;
    }

    # Portal frontend
    location ~ ^/portal/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/portal/index.php;
        fastcgi_param SCRIPT_NAME     /portal/index.php;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_read_timeout 300;
    }

    # Main SPA + install wizard
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handler (install wizard, oauth, etc.)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_read_timeout 300;
    }

    # Static files cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security
    location ~ /\. {
        deny all;
    }

    location ~ ^/(application|data|custom|vendor|tests)/ {
        deny all;
    }
}
