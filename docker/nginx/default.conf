server {
    listen 80;
    server_name _;

    # Document root points to the public/ subdirectory
    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Client-side assets (JS, CSS) live outside the document root
    location /client {
        alias /var/www/html/client;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            expires max;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # Main application routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API routing (public/api/v1/ has its own index.php)
    location ~ ^/api/v1/(.*)$ {
        try_files $uri $uri/ /api/v1/index.php?$query_string;
    }

    # Portal routing
    location ~ ^/portal/(.*)$ {
        try_files $uri $uri/ /portal/index.php?$query_string;
    }

    # PHP-FPM handler
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;

        # Pass Authorization header to PHP (needed for API)
        fastcgi_param HTTP_ESPO_CGI_AUTH $http_authorization;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to hidden files and sensitive directories
    location ~ /\. {
        deny all;
    }

    location ~ ^/(application|data|custom|vendor|tests)/ {
        deny all;
    }
}
